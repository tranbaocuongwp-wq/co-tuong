[package]
name = "co-tuong-engine-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly bindings for the Xiangqi engine"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
co-tuong-engine = { path = "../engine" }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Turns a Rust panic into a readable console message with a stack trace instead
# of a bare "unreachable" trap, which is otherwise impossible to diagnose from
# the browser.
console_error_panic_hook = "0.1"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack.profile.release]
# Optimise for size as well as speed: the .wasm ships to every browser visit.
wasm-opt = ["-O3"]
