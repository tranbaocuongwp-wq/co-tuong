  </g>

  <!--
    The corner ribbon, across the bottom-right.

    Two lines of constant x+y bound it, which is what makes a band at exactly
    45° without any rotation arithmetic. Clipped to the card, or it spills past
    the rounded corner and the icon stops looking like one shape.

    The lettering is outlines too, from Arial Bold, for the same reason as the
    main glyph: a logo must not change shape depending on what is installed.

    Not repeated on the maskable icon: Android crops that to a circle or a
    squircle, and a corner ribbon is the one thing guaranteed to be cropped off.
  -->
  <g clip-path="url(#card)">
    <polygon points="512,248 248,512 368,512 512,368" fill="#0000001f" transform="translate(0,6)" />
    <polygon points="512,248 248,512 368,512 512,368" fill="url(#ribbon)" />
    <g transform="rotate(-45 410 410) translate(304.485 429.445) scale(0.021333 -0.021333)" fill="#3d1608">
